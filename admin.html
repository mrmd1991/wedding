<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>قائمة المدعوين</title>
<style>
:root{--gold:#d9b66f;--gold2:#f2ddb0;--bg:#090a06;--card:#12140d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:#f2ead5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}
body{min-height:100vh;padding:24px 16px}
.wrap{max-width:1000px;margin:auto}
h1{color:var(--gold2);font-size:22px;margin:0 0 20px;text-align:center}
.card{background:var(--card);border:1px solid rgba(217,182,111,.4);border-radius:16px;padding:22px}
.field{display:block;width:100%;border:1px solid #82662f;border-radius:10px;background:#17190f;color:#f6e9c6;font:inherit;font-size:16px;padding:11px;margin-bottom:12px;direction:ltr;text-align:left}
.btn{display:inline-block;border:1px solid var(--gold);border-radius:10px;background:linear-gradient(180deg,#d8b66f,#a9813f);color:#151006;text-decoration:none;padding:10px 18px;font-weight:800;cursor:pointer}
.btn.secondary{background:#1b1d13;color:var(--gold2)}
.err{color:#e59a9a;font-size:14px;margin:8px 0 0}
#loginCard{max-width:360px;margin:60px auto 0}
[hidden]{display:none!important}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid rgba(217,182,111,.4);border-radius:14px;padding:16px;text-align:center}
.stat b{display:block;font-size:26px;color:var(--gold2)}
.stat span{font-size:13px;color:#cbbf9c}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .field{width:auto;flex:1;min-width:180px;margin:0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid rgba(217,182,111,.2);text-align:right}
th{color:var(--gold2);position:sticky;top:0;background:var(--card)}
tr:hover td{background:rgba(217,182,111,.06)}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px}
.tag.yes{background:rgba(120,200,120,.18);color:#9fe0a0}
.tag.no{background:rgba(200,120,120,.18);color:#e5a3a3}
.tag.full{background:rgba(217,182,111,.2);color:var(--gold2)}
tr.declinedRow td{background:rgba(200,120,120,.07);color:#d9b3b3}
tr.declinedRow:hover td{background:rgba(200,120,120,.12)}
tr.rejectedRow td{background:rgba(217,182,111,.09);color:#e0cfa0}
tr.rejectedRow:hover td{background:rgba(217,182,111,.15)}
.tableWrap{overflow-x:auto}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.capEdit{display:flex;gap:6px;margin-top:10px}
.capEdit input{margin:0;padding:7px;font-size:14px;text-align:center}
.capEdit button{padding:7px 12px;font-size:13px}
.capMsg{font-size:12px;margin-top:6px;min-height:14px}
.capMsg.ok{color:#9fe0a0}
.capMsg.err{color:#e59a9a}
.toggleBtn{display:block;width:100%;margin-top:10px;border-radius:10px;border:1px solid;padding:8px;font-size:13px;font-weight:700;cursor:pointer;font:inherit}
.toggleBtn.on{background:rgba(120,200,120,.14);border-color:#5a8a5a;color:#9fe0a0}
.toggleBtn.off{background:rgba(200,120,120,.14);border-color:#8a5a5a;color:#e5a3a3}
.sideTabs{display:flex;gap:6px}
.sideTab{padding:9px 14px;border-radius:10px;border:1px solid #82662f;background:#17190f;color:#cbbf9c;cursor:pointer;font:inherit;font-size:14px}
.sideTab.active{border-color:var(--gold);color:var(--gold2);background:#26210f}
.rowBtn{padding:5px 10px;font-size:12px;border-radius:8px;border:1px solid var(--gold);background:transparent;color:var(--gold2);cursor:pointer;font:inherit;margin-inline-end:4px}
.rowBtn.danger{border-color:#8a5a5a;color:#e5a3a3}
.modalOverlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.modalBox{background:var(--card);border:1px solid rgba(217,182,111,.5);border-radius:16px;padding:22px;max-width:420px;width:100%;max-height:90vh;overflow-y:auto}
.modalBox h3{color:var(--gold2);margin:0 0 14px}
.modalRow{display:flex;gap:10px}
.modalRow .field{flex:1}
</style>
</head>
<body>
<div class="wrap">
  <h1>قائمة المدعوين</h1>

  <div id="loginCard" class="card">
    <label class="field" style="border:none;padding:0;margin-bottom:6px;background:none;color:var(--gold2);text-align:right">البريد الإلكتروني</label>
    <input class="field" id="email" type="email" autocomplete="username">
    <label class="field" style="border:none;padding:0;margin-bottom:6px;background:none;color:var(--gold2);text-align:right">كلمة المرور</label>
    <input class="field" id="password" type="password" autocomplete="current-password">
    <button class="btn" id="loginBtn" type="button" style="width:100%">دخول</button>
    <p class="err" id="loginErr"></p>
  </div>

  <div id="setPasswordCard" class="card" style="max-width:360px;margin:60px auto 0" hidden>
    <p class="note" style="color:var(--gold2);margin:0 0 14px;text-align:center">مرحباً، يرجى تعيين كلمة مرور لحسابك</p>
    <label class="field" style="border:none;padding:0;margin-bottom:6px;background:none;color:var(--gold2);text-align:right">كلمة المرور الجديدة</label>
    <input class="field" id="newPassword" type="password" autocomplete="new-password">
    <label class="field" style="border:none;padding:0;margin-bottom:6px;background:none;color:var(--gold2);text-align:right">تأكيد كلمة المرور</label>
    <input class="field" id="newPassword2" type="password" autocomplete="new-password">
    <button class="btn" id="setPasswordBtn" type="button" style="width:100%">حفظ كلمة المرور والدخول</button>
    <p class="err" id="setPasswordErr"></p>
  </div>

  <div id="dashboard" hidden>
    <div class="topbar">
      <div id="whoami" style="color:#cbbf9c;font-size:13px"></div>
      <div style="display:flex;gap:8px">
        <button class="btn secondary" id="exportBtn" type="button">تصدير CSV</button>
        <button class="btn secondary" id="logoutBtn" type="button">تسجيل خروج</button>
      </div>
    </div>
    <div class="stats">
      <div class="stat">
        <b><span id="groomCount">-</span> / <span id="groomCapacity">-</span></b>
        <span>طرف العريس</span>
        <div class="capEdit">
          <input class="field" id="groomCapInput" type="number" min="0" step="1" placeholder="الحد الأقصى">
          <button class="btn secondary" id="groomCapSave" type="button">حفظ</button>
        </div>
        <p class="capMsg" id="groomCapMsg"></p>
        <button class="toggleBtn" id="groomToggle" type="button">-</button>
      </div>
      <div class="stat">
        <b><span id="brideCount">-</span> / <span id="brideCapacity">-</span></b>
        <span>طرف العروس</span>
        <div class="capEdit">
          <input class="field" id="brideCapInput" type="number" min="0" step="1" placeholder="الحد الأقصى">
          <button class="btn secondary" id="brideCapSave" type="button">حفظ</button>
        </div>
        <p class="capMsg" id="brideCapMsg"></p>
        <button class="toggleBtn" id="brideToggle" type="button">-</button>
      </div>
    </div>
    <div class="toolbar">
      <div class="sideTabs">
        <button class="sideTab active" id="filterAll" type="button" data-side="">الكل</button>
        <button class="sideTab" id="filterGroom" type="button" data-side="groom">طرف العريس</button>
        <button class="sideTab" id="filterBride" type="button" data-side="bride">طرف العروس</button>
      </div>
      <input class="field" id="search" type="text" placeholder="بحث بالاسم أو الجوال...">
      <button class="btn secondary" id="refreshBtn" type="button">تحديث</button>
      <button class="btn" id="addBtn" type="button">إضافة ضيف</button>
    </div>
    <div class="tableWrap">
      <table>
        <thead>
          <tr>
            <th>الاسم</th><th>الجوال</th><th>الطرف</th><th>الحضور</th><th>المرافقون</th><th>الرمز</th><th>ملاحظات</th><th>التاريخ</th><th>إجراءات</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <h1 style="margin-top:34px">الأجهزة التي فتحت الرابط</h1>
    <div class="tableWrap">
      <table>
        <thead>
          <tr>
            <th>الطرف</th><th>معرف الجهاز</th><th>تاريخ الفتح</th>
          </tr>
        </thead>
        <tbody id="linkOpenRows"></tbody>
      </table>
    </div>
  </div>
</div>

<div id="editModal" class="modalOverlay" hidden>
  <div class="modalBox">
    <h3 id="modalTitle">إضافة ضيف</h3>
    <label class="rsvp-label" style="color:var(--gold2);display:block;margin-bottom:6px">الاسم</label>
    <input class="field" id="editName">
    <label class="rsvp-label" style="color:var(--gold2);display:block;margin-bottom:6px">الجوال</label>
    <input class="field" id="editPhone">
    <div class="modalRow">
      <div>
        <label class="rsvp-label" style="color:var(--gold2);display:block;margin-bottom:6px">الطرف</label>
        <select class="field" id="editSide">
          <option value="groom">العريس</option>
          <option value="bride">العروس</option>
        </select>
      </div>
      <div>
        <label class="rsvp-label" style="color:var(--gold2);display:block;margin-bottom:6px">الحضور</label>
        <select class="field" id="editAttending">
          <option value="true">حاضر</option>
          <option value="false">معتذر</option>
        </select>
      </div>
    </div>
    <label class="rsvp-label" style="color:var(--gold2);display:block;margin-bottom:6px">عدد المرافقين</label>
    <input class="field" id="editCompanions" type="number" min="0" step="1">
    <label class="rsvp-label" style="color:var(--gold2);display:block;margin-bottom:6px">ملاحظات</label>
    <textarea class="field" id="editNotes" rows="3"></textarea>
    <div style="display:flex;gap:10px;margin-top:6px">
      <button class="btn" id="modalSave" type="button">حفظ</button>
      <button class="btn secondary" id="modalCancel" type="button">إلغاء</button>
    </div>
    <p class="capMsg" id="modalMsg"></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
  const SUPABASE_URL = 'https://anbszfoqttndggebeupo.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFuYnN6Zm9xdHRuZGdnZWJldXBvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MjI3NjgsImV4cCI6MjEwNDk5ODc2OH0.ADnaz0SlGMCsrg9gN4ZLYiDebtc2soK2IgGvTaWvjaA';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const $=s=>document.querySelector(s);
  let allRows=[];
  let sideFilter='';
  let editingId=null;

  const sideLabel={groom:'العريس',bride:'العروس'};

  function render(rows){
    const q=$('#search').value.trim().toLowerCase();
    let filtered=sideFilter?rows.filter(r=>r.side===sideFilter):rows;
    if(q) filtered=filtered.filter(r=>(r.guest_name||'').toLowerCase().includes(q)||(r.phone||'').toLowerCase().includes(q));
    $('#rows').innerHTML=filtered.map(r=>`
      <tr class="${r.capacity_rejected?'rejectedRow':(r.attending?'':'declinedRow')}">
        <td>${escapeHtml(r.guest_name)}</td>
        <td style="direction:ltr;text-align:right">${escapeHtml(r.phone||'')}</td>
        <td>${sideLabel[r.side]||r.side}</td>
        <td>${r.capacity_rejected?'<span class="tag full">مرفوض (اكتمال العدد)</span>':(r.attending?'<span class="tag yes">حاضر</span>':'<span class="tag no">معتذر</span>')}</td>
        <td>${r.companions}</td>
        <td style="direction:ltr;text-align:right">${r.code||''}</td>
        <td>${escapeHtml(r.notes||'')}</td>
        <td>${new Date(r.created_at).toLocaleString('ar')}</td>
        <td style="white-space:nowrap">
          <button class="rowBtn" type="button" data-edit="${r.id}">تعديل</button>
          <button class="rowBtn danger" type="button" data-delete="${r.id}">حذف</button>
        </td>
      </tr>`).join('');
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function loadRows(){
    const {data,error}=await supabase.from('rsvps').select('*').order('created_at',{ascending:false});
    if(error){$('#loginErr').textContent='تعذر تحميل البيانات: '+error.message;return}
    allRows=data||[];
    render(allRows);
  }

  async function loadCapacity(){
    const {data,error}=await supabase.from('side_counts').select('*');
    if(error||!data) return;
    data.forEach(r=>{
      $('#'+r.side+'Count').textContent=r.used;
      $('#'+r.side+'Capacity').textContent=r.capacity;
      $('#'+r.side+'CapInput').value=r.capacity;
      const btn=$('#'+r.side+'Toggle');
      btn.textContent=r.enabled?'الرابط مفعّل — اضغط للإيقاف':'الرابط متوقف — اضغط للتفعيل';
      btn.className='toggleBtn '+(r.enabled?'on':'off');
      btn.dataset.enabled=r.enabled?'1':'0';
    });
  }

  async function saveCapacity(side){
    const input=$('#'+side+'CapInput');
    const msg=$('#'+side+'CapMsg');
    const value=parseInt(input.value,10);
    if(isNaN(value)||value<0){msg.textContent='أدخل رقماً صحيحاً';msg.className='capMsg err';return}
    msg.textContent='...';msg.className='capMsg';
    const {data,error}=await supabase.rpc('admin_set_capacity',{p_side:side,p_new_capacity:value});
    if(error||!data||!data.ok){msg.textContent='تعذر الحفظ';msg.className='capMsg err';return}
    msg.textContent='تم الحفظ';msg.className='capMsg ok';
    await loadCapacity();
  }

  async function toggleEnabled(side){
    const btn=$('#'+side+'Toggle');
    const nextValue=btn.dataset.enabled!=='1';
    btn.disabled=true;
    const {data,error}=await supabase.rpc('admin_set_enabled',{p_side:side,p_enabled:nextValue});
    btn.disabled=false;
    if(error||!data||!data.ok) return;
    await loadCapacity();
  }

  async function loadLinkOpens(){
    const {data,error}=await supabase.from('link_opens').select('*').order('created_at',{ascending:false});
    if(error){$('#linkOpenRows').innerHTML='';return}
    $('#linkOpenRows').innerHTML=(data||[]).map(r=>`
      <tr>
        <td>${sideLabel[r.side]||r.side}</td>
        <td style="direction:ltr;text-align:right">${escapeHtml(r.device_id)}</td>
        <td>${new Date(r.created_at).toLocaleString('ar')}</td>
      </tr>`).join('');
  }

  async function showDashboard(session){
    $('#loginCard').hidden=true;
    $('#setPasswordCard').hidden=true;
    $('#dashboard').hidden=false;
    $('#whoami').textContent=session.user.email;
    await Promise.all([loadRows(),loadCapacity(),loadLinkOpens()]);
  }

  const hashParams=new URLSearchParams(location.hash.replace(/^#/,''));
  const authType=hashParams.get('type');

  supabase.auth.getSession().then(({data})=>{
    if(!data.session) return;
    if(authType==='invite'||authType==='recovery'){
      history.replaceState(null,'',location.pathname+location.search);
      $('#loginCard').hidden=true;
      $('#setPasswordCard').hidden=false;
    }else{
      showDashboard(data.session);
    }
  });

  $('#setPasswordBtn').addEventListener('click',async()=>{
    const err=$('#setPasswordErr');
    err.textContent='';
    const p1=$('#newPassword').value;
    const p2=$('#newPassword2').value;
    if(p1.length<8){err.textContent='كلمة المرور يجب أن تكون 8 أحرف على الأقل';return}
    if(p1!==p2){err.textContent='كلمتا المرور غير متطابقتين';return}
    const {error}=await supabase.auth.updateUser({password:p1});
    if(error){err.textContent='تعذر الحفظ، حاول مرة أخرى';return}
    const {data:sessionData}=await supabase.auth.getSession();
    if(sessionData.session) showDashboard(sessionData.session);
  });

  $('#loginBtn').addEventListener('click',async()=>{
    $('#loginErr').textContent='';
    const email=$('#email').value.trim();
    const password=$('#password').value;
    if(!email||!password){$('#loginErr').textContent='أدخل البريد وكلمة المرور';return}
    const {data,error}=await supabase.auth.signInWithPassword({email,password});
    if(error){$('#loginErr').textContent='بيانات الدخول غير صحيحة';return}
    showDashboard(data.session);
  });

  $('#logoutBtn').addEventListener('click',async()=>{
    await supabase.auth.signOut();
    location.reload();
  });

  $('#refreshBtn').addEventListener('click',()=>Promise.all([loadRows(),loadCapacity(),loadLinkOpens()]));
  $('#search').addEventListener('input',()=>render(allRows));
  $('#groomCapSave').addEventListener('click',()=>saveCapacity('groom'));
  $('#brideCapSave').addEventListener('click',()=>saveCapacity('bride'));
  $('#groomToggle').addEventListener('click',()=>toggleEnabled('groom'));
  $('#brideToggle').addEventListener('click',()=>toggleEnabled('bride'));

  document.querySelectorAll('.sideTab').forEach(tab=>{
    tab.addEventListener('click',()=>{
      document.querySelectorAll('.sideTab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      sideFilter=tab.dataset.side;
      render(allRows);
    });
  });

  function openModal(row){
    editingId=row?row.id:null;
    $('#modalTitle').textContent=row?'تعديل ضيف':'إضافة ضيف';
    $('#editName').value=row?row.guest_name:'';
    $('#editPhone').value=row?(row.phone||''):'';
    $('#editSide').value=row?row.side:(sideFilter||'groom');
    $('#editAttending').value=row?String(row.attending):'true';
    $('#editCompanions').value=row?row.companions:0;
    $('#editNotes').value=row?(row.notes||''):'';
    $('#modalMsg').textContent='';
    $('#editModal').hidden=false;
  }
  function closeModal(){$('#editModal').hidden=true}

  $('#addBtn').addEventListener('click',()=>openModal(null));
  $('#modalCancel').addEventListener('click',closeModal);

  $('#rows').addEventListener('click',e=>{
    const editId=e.target.dataset.edit;
    const deleteId=e.target.dataset.delete;
    if(editId){
      const row=allRows.find(r=>r.id===editId);
      if(row) openModal(row);
    }else if(deleteId){
      deleteGuest(deleteId);
    }
  });

  async function deleteGuest(id){
    if(!confirm('حذف هذا الضيف نهائياً؟')) return;
    const {data,error}=await supabase.rpc('admin_delete_rsvp',{p_id:id});
    if(error||!data||!data.ok){alert('تعذر الحذف');return}
    await Promise.all([loadRows(),loadCapacity()]);
  }

  $('#modalSave').addEventListener('click',async()=>{
    const msg=$('#modalMsg');
    const name=$('#editName').value.trim();
    const phone=$('#editPhone').value.trim();
    const side=$('#editSide').value;
    const attending=$('#editAttending').value==='true';
    const companions=Math.max(0,parseInt($('#editCompanions').value,10)||0);
    const notes=$('#editNotes').value.trim();
    if(!name){msg.textContent='الاسم مطلوب';msg.className='capMsg err';return}
    msg.textContent='...';msg.className='capMsg';

    let result;
    if(editingId){
      result=await supabase.rpc('admin_update_rsvp',{
        p_id:editingId,p_name:name,p_phone:phone,p_side:side,
        p_attending:attending,p_companions:companions,p_notes:notes||null
      });
    }else{
      result=await supabase.rpc('admin_add_rsvp',{
        p_name:name,p_phone:phone,p_side:side,
        p_attending:attending,p_companions:companions,p_notes:notes||null
      });
    }
    const {data,error}=result;
    if(error||!data||!data.ok){
      const reason=data&&data.error==='side_full'?'الطرف المختار ممتلئ':'تعذر الحفظ';
      msg.textContent=reason;msg.className='capMsg err';
      return;
    }
    closeModal();
    await Promise.all([loadRows(),loadCapacity()]);
  });

  $('#exportBtn').addEventListener('click',()=>{
    const header=['guest_name','phone','side','attending','capacity_rejected','companions','code','notes','created_at'];
    const lines=[header.join(',')].concat(allRows.map(r=>header.map(h=>{
      const v=r[h]==null?'':String(r[h]).replace(/"/g,'""');
      return /[",\n]/.test(v)?`"${v}"`:v;
    }).join(',')));
    const blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='rsvps.csv';document.body.appendChild(a);a.click();a.remove();
    URL.revokeObjectURL(url);
  });
})();
</script>
</body>
</html>
